<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Subfolders">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Subfolders Demo</title>
<style>

:root{--blue:#0070F4;--lblue:#E6F0FF;--gray:#999;--line:#EEE;--yellow:#F0CF6D;--txt:#000;--sub:#5B6A91}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#ECECEC;color:#111;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:32px 24px}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font:inherit}
svg{display:block}
/* phone */
.phone{width:395px;height:832px;border-radius:54px;background:#111;padding:10px;flex:none;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.device{position:relative;width:375px;height:812px;border-radius:44px;overflow:hidden;background:#fff}
.status{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px 0 32px;font-weight:600;font-size:15px;z-index:5;background:#fff}
.status.dark{background:#000;color:#fff}
.status .icons{display:flex;gap:6px;align-items:center}
.screen{position:absolute;top:44px;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000;z-index:40}
.homebar.light{background:#fff}
/* nav */
.nav{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#fff;z-index:3}
.nav .r{display:flex;gap:18px;align-items:center}
.nav .title{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:17px;white-space:nowrap}
.ic{width:24px;height:24px;stroke:#111;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px}
.ic.blue{stroke:var(--blue)}
.ic.gray{stroke:#999}
.ic.white{stroke:#fff}
/* header */
.hdr{padding:8px 16px 0;display:flex;flex-direction:column;gap:8px}
.crumb{display:flex;align-items:center;gap:2px;color:var(--sub);font-size:13px;cursor:pointer;width:max-content}
.crumb .ic{stroke:var(--sub);width:14px;height:14px}
.titlebox{display:flex;gap:12px;align-items:center}
.picon{width:50px;height:50px;border-radius:5px;background:var(--yellow);display:flex;align-items:center;justify-content:center;flex:none}
.picon .ic{stroke:#fff;fill:#fff;width:26px;height:26px}
.tname{font-size:18px;font-weight:600}
.tsub{font-size:14px;color:var(--gray);margin-top:4px}
/* tabs */
.tabs{display:flex;margin:20px 16px 0;border-bottom:1px solid var(--line)}
.tab{flex:1;text-align:center;padding:12px 0 10px;font-size:16px;color:var(--gray);border-bottom:2px solid transparent;cursor:pointer}
.tab.on{color:#000;font-weight:600;border-bottom-color:#000}
/* folders */
.fsec{margin-top:20px}
.fhead{display:flex;justify-content:space-between;align-items:center;padding:0 16px}
.fcount{display:flex;align-items:center;gap:2px;font-weight:600;font-size:15px;cursor:pointer}
.link{color:var(--blue);font-size:14px;display:flex;align-items:center;gap:2px;cursor:pointer}
.strip{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.fcard{width:120px;flex:none;cursor:pointer}
.cover{width:120px;height:120px;border-radius:8px;background:#F2F2F2 center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center}
.cover .badge{position:absolute;left:6px;top:6px;background:rgba(255,255,255,.92);border-radius:6px;padding:4px}
.cover .tagj{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:500;border-radius:4px;padding:2px 6px}
.fname{font-size:13px;font-weight:500;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta{font-size:11px;color:var(--gray);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-new{margin:20px 16px 0;display:inline-flex;align-items:center;gap:4px;border:1px dashed #BFD7FF;border-radius:16px;padding:6px 12px 6px 9px;color:var(--blue);font-size:14px;cursor:pointer}
/* actions */
.acts{display:flex;align-items:center;gap:8px;padding:0 16px;margin-top:20px}
.btn{display:flex;align-items:center;gap:4px;border-radius:8px;padding:9px 12px;font-size:16px;cursor:pointer}
.btn.pri{background:var(--blue);color:#fff}
.btn.sec{background:var(--lblue)}
.scope{margin-left:auto;display:flex;align-items:center;gap:2px;background:#F5F5F5;border-radius:16px;padding:7px 8px 7px 12px;font-size:14px;color:#333;cursor:pointer}
.scope.on{background:var(--lblue);color:var(--blue)}
.scope.on .ic{stroke:var(--blue)}
/* photos */
.day{margin-top:20px}
.dayh{display:flex;justify-content:space-between;align-items:center;padding:0 16px 12px;font-size:16px;font-weight:500}
.ring{width:20px;height:20px;border-radius:50%;border:1.5px solid #C4C4C4}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ph{aspect-ratio:1;background:#ddd center/cover no-repeat;position:relative;cursor:pointer}
.ph .src{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:500;border-radius:4px;padding:2px 6px 2px 4px;display:flex;align-items:center;gap:3px}
.ph .src .ic{width:12px;height:12px;stroke:#fff}
.ph .sel{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.15)}
.ph.picked .sel{background:var(--blue);border-color:var(--blue);display:flex;align-items:center;justify-content:center}
.ph.picked::after{content:"";position:absolute;inset:0;border:3px solid var(--blue)}
.ph.new{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.phead{display:flex;justify-content:space-between;align-items:center;padding:0 16px;margin-top:20px;font-size:14px;color:#666}
.phead+.day{margin-top:12px}
.picklist{margin:8px 16px 0;max-height:220px;overflow-y:auto;border:1px solid #EEE;border-radius:12px}
.pick{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:15px;cursor:pointer}
.pick+.pick{border-top:1px solid #F2F2F2}
.pick .n{color:#999;font-size:13px}
.cb{width:20px;height:20px;border-radius:5px;border:1.5px solid #C4C4C4;display:flex;align-items:center;justify-content:center;flex:none}
.cb.on{background:var(--blue);border-color:var(--blue)}
.empty{padding:48px 32px;text-align:center;color:var(--gray);font-size:14px;line-height:1.6}
.pad{height:120px}
/* fab */
.fab{position:absolute;right:16px;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:6}
.fab.up{bottom:108px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.14)}
.fab.cam{bottom:34px;background:var(--blue);box-shadow:0 4px 12px rgba(0,70,160,.3)}
/* list rows */
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}
.row .th{width:52px;height:52px;border-radius:8px;background:#F2F2F2 center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center}
.row .main{flex:1;min-width:0}
.row .t{font-size:16px;display:flex;align-items:center;gap:6px}
.row .m{font-size:13px;color:var(--gray);margin-top:3px}
.tagg{font-size:11px;font-weight:500;background:#EDF7E6;color:#3B7A1A;border-radius:4px;padding:1px 5px}
.search{margin:4px 16px 8px;background:#F5F5F5;border-radius:8px;display:flex;align-items:center;gap:8px;padding:9px 12px}
.search input{border:none;background:none;outline:none;flex:1;font-size:15px}
.sortbar{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;font-size:13px;color:var(--gray)}
.sortbar button{color:#333;display:flex;align-items:center;gap:2px;font-size:13px}
/* form */
.gray-bg{background:#F5F5F5;min-height:100%}
.card{background:#fff;border-radius:12px;margin:16px}
.field{padding:16px;display:flex;flex-direction:column;gap:10px}
.field input{background:#F5F5F5;border:none;border-radius:8px;padding:11px 12px;font-size:16px;outline:none}
.field input:focus{box-shadow:0 0 0 2px var(--blue) inset}
.note{font-size:13px;color:var(--gray);padding:0 20px;line-height:1.5}
.bottombar{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:12px 16px 34px;display:flex;gap:12px;z-index:20;border-top:1px solid var(--line)}
.bigbtn{flex:1;background:var(--blue);color:#fff;border-radius:8px;padding:13px;font-size:16px;font-weight:600;text-align:center;cursor:pointer}
.bigbtn.dis{background:#9FC5F8;cursor:not-allowed}
.bigbtn.light{flex:none;background:var(--lblue);color:var(--blue);font-weight:400;display:flex;align-items:center;gap:4px;padding:13px 14px}
/* overlays */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:30}
.dim.light{background:rgba(0,0,0,.12)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;z-index:31;padding-bottom:34px;animation:up .22s ease}
.sheet.still,.menu.still{animation:none}
.sheet.tall{top:54px;display:flex;flex-direction:column;padding-bottom:0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:36px;height:5px;border-radius:3px;background:#D9D9D9;margin:8px auto 0}
.sheet-h{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative}
.sheet-h .title{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:17px;white-space:nowrap}
.opts{margin:0 16px;background:#F7F7F7;border-radius:12px}
.opt{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.opt+.opt{border-top:1px solid #EBEBEB}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid #C4C4C4;flex:none;background:#fff}
.radio.on{border:none;background:var(--blue);box-shadow:inset 0 0 0 7px var(--blue),inset 0 0 0 11px #fff}
.opt .t{font-size:16px}.opt .m{font-size:13px;color:var(--gray);margin-top:3px;line-height:1.4}
.pk-body{flex:1;overflow-y:auto}
.pk-label{font-size:13px;color:var(--gray);padding:12px 16px 4px}
.pk-row{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer}
.pk-row.cur{opacity:.4;cursor:default}
.pk-row.hl{background:#F2F7FF}
.pk-row .t{font-size:16px}.pk-row .m{font-size:13px;color:var(--gray);margin-top:2px}
.pk-row .main{flex:1;min-width:0}
.curtag{font-size:12px;color:#848484;background:#F0F0F0;border-radius:4px;padding:2px 6px}
.sep{height:8px;background:#F5F5F5}
.menu{position:absolute;left:16px;top:120px;width:250px;background:#fff;border-radius:12px;padding:6px 0;z-index:31;box-shadow:0 8px 24px rgba(0,0,0,.16);animation:up .18s ease}
.menu .mi{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:16px;cursor:pointer}
.menu .mi:hover{background:#F7F7F7}
.menu .mi.cur{font-weight:600}
.selbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px 34px;display:flex;gap:10px;z-index:20}
.selbar .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#333;cursor:pointer}
.selbar .b.dis{opacity:.35;cursor:default}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;font-size:14px;border-radius:10px;padding:10px 14px;z-index:50;max-width:320px;text-align:center;line-height:1.4;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
/* camera */
.camview{position:absolute;inset:0;background:#000;color:#fff;z-index:25}
.camview .vf{position:absolute;left:0;right:0;top:96px;height:560px;background:center/cover no-repeat}
.camview .dest{position:absolute;top:52px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:18px;padding:7px 12px 7px 10px;font-size:14px;white-space:nowrap;cursor:pointer;max-width:320px}
.camview .dest b{font-weight:600}
.camview .x{position:absolute;top:52px;left:16px;cursor:pointer}
.camview .shutter{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 3px #000;cursor:pointer}
.camview .hint{position:absolute;bottom:140px;left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.75)}
/* doc list */
.doc{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #F3F3F3}
.doc .f{width:44px;height:44px;border:1px solid #E5E5E5;border-radius:6px;position:relative}
.doc .f span{position:absolute;right:3px;top:3px;font-size:8px;font-weight:700;color:#fff;background:#E5484D;border-radius:2px;padding:1px 3px}
.doc .t{font-size:16px}.doc .m{font-size:13px;color:var(--gray);margin-top:3px}
/* side panel */
.panel{width:400px;flex:none;display:flex;flex-direction:column;gap:16px;position:sticky;top:32px}
.pcard{background:#fff;border-radius:16px;padding:18px 20px}
.pcard h1{font-size:20px;font-weight:700}
.pcard h2{font-size:15px;font-weight:700;margin-bottom:10px}
.pcard p,.pcard li{font-size:14px;line-height:1.65;color:#333}
.pcard ul,.pcard ol{padding-left:18px}
.scen{display:flex;flex-direction:column;gap:8px}
.scen button{text-align:left;padding:10px 12px;border-radius:10px;background:#F5F7FA;font-size:14px;line-height:1.4}
.scen button:hover{background:#E9F1FF}
.scen button.on{background:var(--blue);color:#fff}
.scen button small{display:block;opacity:.75;font-size:12px;margin-top:2px}
.explain{background:#FFF8E1;border-radius:16px;padding:18px 20px}
.explain h2{font-size:15px;font-weight:700;color:#5C4A00;margin-bottom:8px}
.explain p{font-size:14px;line-height:1.7;color:#5C4A00}
.steps li.done{color:#9AA0A6;text-decoration:line-through}
.reset{font-size:13px;color:var(--blue);margin-top:10px}
.tagline{font-size:13px;color:#666;margin-top:6px;line-height:1.6}
.pulse{animation:pulse 1.4s ease-in-out infinite;border-radius:10px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,112,244,.55)}50%{box-shadow:0 0 0 6px rgba(0,112,244,0)}}

/* ================= demo5 · 按 Figma 现有页面还原 ================= */
:root{--blue:#0070F4;--lblue:#E6F0FF;--bg2:#F2F4F7;--gray:#8A8A8E;--sub:#5B6A91}
body{flex-wrap:wrap}
@media (max-width:900px){.panel{position:static}}
.screen.withtabs{bottom:83px}
.screen.dark{background:#000}
.screen.cam{background:#F4F5F7}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blue{color:var(--blue)}
.txtbtn{color:var(--blue);font-size:16px}
.req{color:#E5484D;margin-left:1px}.optl{color:#999;font-size:13px;font-weight:400}
.hint{font-size:12px;color:#999;line-height:1.5}.pad16{padding:0 16px 14px}
.hr{height:1px;background:#EEE;margin:0 16px}
.row.static{cursor:default;padding:14px 16px}
.row .t{font-size:16px}.row .m{font-size:13px;color:#999;margin-top:2px}
.inline{border:none;outline:none;background:none;font-size:15px;width:100%;margin-top:4px;color:#333;padding:0}
.convnote{margin:0 16px 12px;padding:10px 12px;border-radius:10px;background:#FFF8E1;color:#5C4A00;font-size:13px;line-height:1.5}
.nav .r{gap:20px}

/* ---- home (userhome2) ---- */
.teamname{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:700}
.teamname .ic{width:18px;height:18px}
.asbar{margin:6px 16px 0;background:#EBF3FE;border-radius:6px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.asbar .ast{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#222}
.asbar .ast b{font-weight:600}
.asbar .on{color:#888;display:flex;align-items:center;gap:4px;flex:none;font-size:15px}
.hsec{margin-top:24px}
.hh{display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:18px;font-weight:600}
.hh>span{display:flex;align-items:center;gap:2px;cursor:pointer}
.hh .ic.s{width:18px;height:18px}
.mstrip{display:flex;gap:10px;padding:14px 16px 0;overflow-x:auto;scrollbar-width:none}
.mcard{width:100px;height:160px;flex:none;border-radius:2px;position:relative;overflow:hidden}
.mcard .mav{position:absolute;left:6px;top:6px;width:34px;height:34px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.mcard .mname{position:absolute;left:8px;bottom:8px;right:6px;color:#fff;font-size:13px;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.prow{display:flex;align-items:center;gap:14px;padding:6px 16px;cursor:pointer}
.prow .thumb{width:70px;height:70px;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center}
.prow.big .thumb{width:100px;height:100px;border-radius:0}
.prow.sm .thumb{width:52px;height:52px}
.prow .main{flex:1;min-width:0}
.prow .t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .m{font-size:14px;color:#999;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .m.blue{color:var(--sub);display:flex;align-items:center;gap:2px;font-size:12px}
.prow .picons{margin-top:6px}
.thumb.ph-empty{background:#EEF1F6}
.thumb.createbox{background:#EBF3FE}
.didnt{font-size:16px;color:#888;padding:28px 16px 12px}
.hstrip{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none}
.hph{width:100px;height:100px;flex:none;position:relative;cursor:pointer}
.ptag,.hph .ptag{position:absolute;left:6px;top:5px;font-size:10px;font-weight:500;color:rgba(255,255,255,.95);text-shadow:0 1px 2px rgba(0,0,0,.25);pointer-events:none}
.fab{width:64px;height:64px}
.fab.cam{bottom:34px}
.fab.cam.home{bottom:100px}
.fab .ic.big{width:30px;height:30px}
.fab.up{bottom:112px}

/* ---- search bar (Projects / Search) ---- */
.search{margin:8px 16px 16px;background:#F2F2F4;border-radius:8px;padding:10px 12px}
.search input{font-size:16px}
.search.big{margin-top:4px}

/* ---- project / folder page (docs, cltab) ---- */
.hdr{padding:10px 16px 0}
.picon{width:50px;height:50px;border-radius:5px;background:#F5C85B}
.picon.gen{background:var(--blue)}
.picon.green{background:#4CC36A}
.picon .ic{width:26px;height:26px}
.tname{font-size:17px;font-weight:600;line-height:1.3}
.tname.big{font-size:22px;font-weight:700;display:flex;align-items:center;gap:6px}
.tsub{font-size:13px;color:#999;margin-top:3px}
.tsub .ic{display:inline-block;vertical-align:-3px;stroke:#999}
.defchip{display:inline-block;font-size:11px;font-weight:600;color:var(--blue);background:var(--lblue);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.gnote{margin:12px 16px 0;padding:10px 12px;border-radius:8px;background:#F2F7FF;color:#33507A;font-size:13px;line-height:1.5}
.chip-new{margin:14px 16px 0}
.tabs{margin:14px 0 0;padding:0 16px;border-bottom:1px solid #EEE}
.tab{font-size:16px;color:#888;padding:12px 0 11px}
.tab.on{color:#000;font-weight:600;border-bottom:2px solid #000}
.acts{margin-top:16px}
.btn{font-size:15px;padding:8px 12px;border-radius:6px}
.btn.sec{background:#EBF3FE;color:#111}
/* folder grid (new) */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:12px 16px 0}
.gcard{cursor:pointer;min-width:0}

/* ---- create project / folder (form) ---- */

/* ---- camera ---- */

/* ---- create checklist ---- */

/* ---- tools / settings ---- */
.toolgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px}

.sheet{border-radius:14px 14px 0 0}

/* iOS grouped action sheet */
.iosas{position:absolute;left:10px;right:10px;bottom:30px;z-index:31;display:flex;flex-direction:column;gap:8px;animation:up .22s ease}
.iosas.still{animation:none}

.iosas .ai+.ai{border-top:1px solid #E5E5EA}

.iosas .ai.cancel{font-weight:600}
/* iOS alert */

.alert.still{animation:none}

.menu .mi{font-size:16px}
.selbar{padding:10px 16px 34px}
.toast{bottom:130px}

    case 'uploadOpen': S.up = {target: store(v.id), sel:new Set(), album: Array.from({length:12}, (_,i)=> (i*37+15)%360)}; push({t:'upload'}); break;
    case 'upPick': { const s = S.up.sel; const i = +d.i; s.has(i) ? s.delete(i) : s.add(i); keep = true; break; }
    case 'upAll': { const u = S.up; if (u.sel.size === u.album.length) u.sel.clear(); else u.album.forEach((_,i)=>u.sel.add(i)); keep = true; break; }
    case 'upTarget': openOv({t:'picker', purpose:'uploadTarget', at:pkStart(S.up.target), sel:S.up.target}); keep = true; break;
    case 'doUpload': { const u = S.up; if (!u.sel.size){ toast('Select photos first'); return; } const list = [...u.sel]; openOv({t:'uploading', count:list.length, done:0, pct:0, target:u.target}); render(true);
      let k = 0; const tick = () => { k++; const i = list[k-1]; DB.items.push({id:nid('i'), type:'photo', folder:u.target, ts:Date.now(), by:DB.me, hue:u.album[i], tag:(DB.tags||TAGS)[(i*5)%(DB.tags||TAGS).length]}); S.ov.done = k; S.ov.pct = Math.round(k/list.length*100); render(true);
        if (k < list.length) setTimeout(tick, 200); else { touch(u.target); save(); setTimeout(()=>{ S.ov = null; pop(); gotoNode(viewOfStore(u.target)); render(); toast(`Uploaded ${plural(list.length,'photo')} to "${destStr(u.target)}"`); }, 300); } };
      setTimeout(tick, 250); return; }
    /* autosave */
    case 'autosaveOpen': { const t = DB.autosave.target; openOv({t:'picker', purpose:'autosave', at:pkStart(t), sel:t && exists(t) ? t : 'NONE'}); keep = true; break; }
    case 'asToggle': DB.autosave.on = !DB.autosave.on; save(); keep = true; break;
    case 'asPick': { const t = DB.autosave.target; openOv({t:'picker', purpose:'autosave', at: t && t !== 'NONE' && exists(t) ? projOf(t) : 'ROOT', sel:t||'NONE'}); keep = true; break; }
    /* checklists */
    case 'openTpl': push({t:'tpl', node:v.id, k:d.k, tab:'activity'}); break;
    case 'tplTab': v.tab = d.tab; keep = true; break;
    case 'clCreate': push({t:'clCreate', target:store(v.id)}); break;
    case 'startExec': { const t = TPL[d.k]; const target = v.target; stack().pop(); push({t:'clExec', k:d.k, target, values:t.steps.map(()=>({}))}); break; }
    case 'execTarget': openOv({t:'picker', purpose:'execTarget', at:pkStart(v.target), sel:v.target}); keep = true; break;
    case 'execStep': { const s = TPL[v.k].steps[+d.i]; const val = v.values[+d.i];
      if (s.k === 'photo'){ val.photos = (val.photos||[]); if (val.photos.length >= 3) val.photos = []; else val.photos.push((Date.now()/97 + val.photos.length*61) % 360 | 0); keep = true; break; }
      openOv({t:'stepText', title:s.t, value:val.text||'', i:+d.i}); keep = true; break; }
    case 'stepTextOk': { const i = S.ov.i; v.values[i].text = S.ov.value || ''; S.ov = null; keep = true; break; }
    case 'submitExec': { const id = nid('i'); DB.items.push({id, type:'checklist', folder:v.target, tpl:v.k, ts:Date.now(), by:DB.me, values:v.values}); touch(v.target); save(); const tgt = v.target; pop(); gotoNode(viewOfStore(tgt)); topV().tab = 'checklists'; push({t:'tpl', node:viewOfStore(tgt), k:v.k, tab:'activity'}); toast(`Submitted to "${destStr(tgt)}"`); break; }
    /* docs */
    case 'docPick': openOv({t:'docpick', target:store(v.id)}); keep = true; break;
    case 'uploadDoc': { const [n, s] = SAMPLE_FILES[+d.i]; const target = S.ov.target; DB.items.push({id:nid('i'), type:'doc', folder:target, name:n, size:s, ts:Date.now(), by:DB.me}); touch(target); save(); S.ov = null; toast(`Uploaded ${n}`); keep = true; break; }
    case 'openDoc': push({t:'doc', id:d.id}); break;
    case 'itemMenu': { const it = DB.items.find(i=>i.id===d.id); const actions = [];
      if (it.type === 'doc') actions.push({label:'Rename', act:'renameItemAsk', arg:{id:it.id}});
      actions.push({label:'Move to…', act:'moveItemOpen', arg:{id:it.id}}, {label:'Delete', red:true, act:'delItemAsk', arg:{id:it.id}});
      openOv({t:'actions', title: it.type==='doc' ? it.name : TPL[it.tpl].name + ' · ' + member(it.by).name, actions}); keep = true; break; }
    case 'renameItemAsk': { const it = DB.items.find(i=>i.id===d.id); openOv({t:'input', title:'Rename', value:it.name, onOk:{act:'renameItem', arg:{id:it.id}}}); keep = true; break; }
    case 'renameItem': { const it = DB.items.find(i=>i.id===d.id); const nv = (d.value||'').trim(); if (nv){ it.name = nv; save(); toast('Renamed'); } keep = true; break; }
    case 'moveItemOpen': { const it = DB.items.find(i=>i.id===d.id); openOv({t:'picker', purpose:'moveItems', noun: it.type==='doc'?'file':'list', ids:[it.id], at:pkStart(it.folder), sel:it.folder}); keep = true; break; }
    case 'delItemAsk': { const it = DB.items.find(i=>i.id===d.id); openOv({t:'confirm', title:'Delete?', text:`"${esc(it.type==='doc'?it.name:TPL[it.tpl].name)}" will be deleted. This can't be undone.`, ok:'Delete', red:true, onOk:{act:'delItems', arg:{ids:[it.id]}}}); keep = true; break; }
    /* picker */
    case 'pkDrill': S.ov.at = d.id; keep = true; break;
    case 'pkUp': { const at = S.ov.at; S.ov.at = isProj(at) ? 'ROOT' : parentOf(at); keep = true; break; }
    case 'pkPick': S.ov.sel = d.id; keep = true; break;
    case 'pkDone': finishPick(S.ov, S.ov.sel); return;
    /* reset */
    case 'resetAsk': openOv({t:'confirm', title:'Reset demo data?', text:'All changes will be cleared and the 4 sample projects restored.', ok:'Reset', red:true, onOk:{act:'reset', arg:{}}}); keep = true; break;
    case 'reset': try { localStorage.removeItem(STORE_KEY); } catch(e){} ALL = seedAll(); DB = ALL.teams[ALL.cur]; save(); freshUI(); toast('Demo data reset'); break;
    case 'teamOpen': openOv({t:'teams'}); keep = true; break;
    case 'teamPick': { S.ov = null; if (d.id !== ALL.cur){ ALL.cur = d.id; DB = ALL.teams[d.id]; save(); freshUI(); toast(`Switched to ${DB.team}`); } break; }
  }
  render(keep);
}
function selItemIds(v){ const s = S.select; if (s.kind === 'tpl') return own(store(v.id),'checklist').filter(i=>s.ids.has(i.tpl)).map(i=>i.id); return [...s.ids]; }
function selNoun(){ return {photo:'photo', tpl:'list', doc:'file'}[S.select.kind]; }
function finishPick(o, sid){
  if (!sid) return; const P = o.purpose;
  if (P === 'moveItems'){ const src = new Set(DB.items.filter(i=>o.ids.includes(i.id)).map(i=>i.folder)); if (src.size===1 && src.has(sid)){ toast('Already here'); return; }
    DB.items.forEach(i=>{ if (o.ids.includes(i.id)) i.folder = sid; }); touch(sid); save(); S.ov = null; if (S.select) S.select = null; toast(`Moved ${plural(o.ids.length, o.noun||'item')} to "${destStr(sid)}"`); render(true); return; }
  if (P === 'moveFolder'){ const f = DB.folders[o.fid]; const target = sid; if (target === f.parent || depthOf(target) + 1 + heightOf(o.fid) > MAX_DEPTH) return; const conv = !isCont(target) && own(target).length > 0; const n = own(target).length; f.parent = target; touch(f.id); save(); S.ov = null;
    toast(`Moved to "${pathStr(target)}"`);
    if (topV().t === 'node' && topV().id === o.fid) gotoNode(o.fid); render(true); return; }
  if (P === 'camTarget'){ S.cam.target = sid; S.cam.banner = null; S.ov = null; render(true); return; }
  if (P === 'uploadTarget'){ S.up.target = sid; S.ov = null; render(true); return; }
  if (P === 'autosave'){ DB.autosave.target = sid; save(); S.ov = null; toast(`Auto save to "${destStr(sid)}"`); render(true); return; }
  if (P === 'execTarget'){ if (sid === 'NONE') return; topV().target = sid; S.ov = null; render(true); return; }
}
function startDownload(count){ if (!count){ toast('Nothing to download'); return; } openOv({t:'download', count, pct:0}); render(true); let p = 0; const tick = () => { p = Math.min(100, p + 25); if (!S.ov || S.ov.t !== 'download') return; S.ov.pct = p; if (p >= 100 && S.select) S.select = null; render(true); if (p < 100) setTimeout(tick, 250); }; setTimeout(tick, 250); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('dis') || (el.closest('.bigbtn.dis') && el.dataset.act !== 'noop')) { const a = el.dataset.act; if (a === 'saveFolder' || a === 'createProject') toast('Enter a name first'); else if (a === 'submitExec') toast('Fill in all required steps first'); return; }
  e.stopPropagation(); act(el.dataset.act, Object.assign({}, el.dataset));
}, true);

/* ---------------- side panel ---------------- */
function explain(){
  const v = topV(), o = S.ov; let t = '', x = '';
  if (o){ const m = {picker:['选择位置', S.ov && (S.ov.purpose==='moveItems'||S.ov.purpose==='moveFolder') ? '「Move to」：项目和文件夹全部展开成一棵树，打勾的是当前位置；有子文件夹的项目下面第一项是 General。移动文件夹时，自己和自己的子文件夹不出现，超过 3 层的位置置灰。' : '相机 / 上传 / 自动同步 / Checklist 关联的位置选择：先选项目，有子文件夹的项目点进去选文件夹（General 排第一）。'], delFolder:['删除文件夹','内容不删：还有其他子文件夹时进上一层的 General；删的是最后一个子文件夹时直接回到上一层（General 随之消失）。'], photoInfo:['照片 Details','显示拍摄人、所在位置（项目 > 文件夹，点击跳转）、时间、地址。'], share:['分享 / 下载 · 选范围','在有子文件夹的一层，默认包含全部文件夹，也可以只挑几个；之后进入现有的分享面板 / 下载流程。'], info:['第一次建子文件夹','原有内容自动进 General，不会丢；删光子文件夹后自动恢复。'], autosave:['自动同步','保存位置可以选到子文件夹。'], ancestors:['面包屑菜单','一步跳回任意上级。'], shareTo:['Share to','现有的分享面板。'], actions:['底部菜单','现有的 iOS 分组样式。']}[o.t]; if (m){ t = m[0]; x = m[1]; } }
  if (!t){ const m = {home:['Teamspace 首页','现有首页样式；项目行上显示「N folders」表示这个项目已经分了子文件夹。顶部 Auto save 可以选到子文件夹。'], projects:['项目列表','现有样式：搜索、⋮ 菜单（改名 / 删除）、底部 Create。'], newProject:['新建项目','现有 Create project 样式。'], folders:['全部文件夹','General 置顶；可按最近更新 / 最久没更新 / 名称排序；按名称或地址搜索。'], folderForm:['New folder / Folder settings','名称必填；Location 可选（下面是附近地址，点一下直接用）。Folder settings 里点 Save in 可移动文件夹，右上角垃圾桶删除。建第一个子文件夹后不弹说明，直接回到上一层看到 General + 新文件夹。'], projSettings:['Project settings','项目名、地址、可见成员、SharePoint / Google Drive 绑定；右上角删除项目。'], allPhotos:['All Photos','全团队照片，标出所属项目。'], photo:['照片详情','现有 Photo Preview 样式；底部 Move 可以移到任意子文件夹，点照片下方的路径可跳到所在文件夹。'], camera:['相机','现有相机样式；底部项目选择条显示存到哪（可选到子文件夹）。在有子文件夹的一层打开，默认存进 General；用「模拟定位」演示按地址自动切换。'], upload:['选择照片上传','底部可以改上传位置。'], tpl:['Checklist 数据页','现有 Activity / Sheet 样式，只显示这个文件夹里的提交记录；每条记录可以移动到其他文件夹。'], clCreate:['新建 Checklist','现有「Start with a template」页面。'], clExec:['填写 Checklist','现有填写页样式；标题下的胶囊显示提交到哪，点开先选项目，再选文件夹。填完必填步骤后 Submit。'], doc:['文件详情','现有样式；右上角 ⋮ 可以重命名、移动、删除。'], search:['Search','现有搜索页样式；结果里增加了「项目和文件夹」，照片会标出所在文件夹。'], tools:['Tools','本 Demo 不含。'], settings:['Settings','可以重置 Demo 数据。']}[v.t];
    if (m){ t = m[0]; x = m[1]; }
    if (v.t === 'node' && exists(v.id)){ const id = v.id;
      if (isCont(id)){ t = (isProj(id)?'项目':'文件夹') + ' · ' + nameOf(id) + '（有子文件夹）'; x = '新增的页面形态：这一层只放文件夹，没有零散内容；没归属的照片、Checklist、文件在 General（排第一，空了隐藏）。'; }
      else if (isGen(id)){ t = 'General（系统默认文件夹）'; x = '上一层没归属的内容都在这里。可以改名，不能删除，不能再建子文件夹。'; }
      else { t = (isProj(id)?'项目':'文件夹') + ' · ' + nameOf(id); x = '现有项目页样式（Photos / Checklists / Docs）。只多了一个「New folder」：建第一个子文件夹后，这一层变成只放文件夹，原有内容进 General。'; }
      if (S.select){ t = '多选'; x = S.select.kind==='photo' ? '照片多选：可按日期全选；底部面板 Link / PDF / ZIP / Excel / KMZ / Move / Delete。' : (S.select.kind==='tpl' ? 'Checklist 多选：按模板勾选，Move 会把这个模板在当前文件夹里的全部记录一起移走。' : 'Docs 多选：勾选文件后 Move / Delete。'); } } }
  document.getElementById('exTitle').textContent = '当前页面：' + t; document.getElementById('exText').textContent = x;
}

load(); freshUI(); render();

</script>
